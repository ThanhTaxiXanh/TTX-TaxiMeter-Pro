name: ttx
description: TTX-TaxiMeter-Pro - dong ho tinh tien taxi offline cho Android.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.0

  # Database
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # Map & Offline Tiles
  maplibre_gl: ^0.21.0
  flutter_map: ^7.0.0               # Chi dung cho mini-map tinh trong TripDetailScreen
  # Tu viet LocalHttpTileServer (dart:io HttpServer) phuc vu Byte-Range cho PMTiles

  # QR & Display
  qr_flutter: ^4.1.0
  screen_brightness: ^2.0.0         # Tu dong tang max do sang khi hien QR thanh toan
  wakelock_plus: ^1.2.0             # Giu sang man hinh khi dang chay chuyen
  # Tu viet VietQR payload builder - CAM dung package vietqr ngoai

  # UI & Charts
  flutter_slidable: ^3.1.0
  fl_chart: ^0.69.0
  google_fonts: ^6.2.0

  # Storage & Security
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.0

  # GPS & Permissions
  geolocator: ^13.0.0
  flutter_foreground_task: ^8.10.0  # Giu GPS chay ngam ben bi tren Android 12+
  permission_handler: ^11.3.0

  # Utils
  intl: ^0.19.0
  crypto: ^3.0.0
  archive: ^3.6.0
  share_plus: ^10.0.0
  file_picker: ^8.0.0
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.20.0
  build_runner: ^2.4.0
  mocktail: ^1.0.0

# geolocator_android 4.6.2 hong build tren Flutter 3.24 (build.gradle cua plugin
# dung thuoc tinh `flutter` khong ton tai o thu vien). Ghim 4.6.1.
dependency_overrides:
  geolocator_android: 4.6.1

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/styles/
