name: Flutter CI

on:
  push:
    branches: [main, develop, 'feat/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Detect Flutter project
        id: detect
        run: |
          if [ -f pubspec.yaml ]; then
            echo "has_flutter=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_flutter=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Chưa có pubspec.yaml (Phase 0). Bỏ qua build Flutter."
          fi

      - uses: actions/setup-java@v4
        if: steps.detect.outputs.has_flutter == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        if: steps.detect.outputs.has_flutter == 'true'
        with:
          channel: stable
          flutter-version: '3.24.x'
          cache: true

      - name: Audit nhanh (PURE core, không mạng ngoài)
        if: steps.detect.outputs.has_flutter == 'true'
        run: |
          if [ -d lib/core ]; then
            if grep -rnE "DateTime\.now|Random\(" lib/core; then
              echo "::error::lib/core không được dùng DateTime.now/Random"; exit 1
            fi
          fi
          if grep -nE "^[[:space:]]+(google_maps[a-z_]*|mapbox[a-z_]*|[a-z_]*vietqr[a-z_]*)[[:space:]]*:" pubspec.yaml; then
            echo "::error::Dependency bị cấm trong pubspec.yaml"; exit 1
          fi

      - name: Cai libsqlite3 (test Drift tren runner)
        if: steps.detect.outputs.has_flutter == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev

      - name: flutter pub get
        if: steps.detect.outputs.has_flutter == 'true'
        run: flutter pub get

      - name: build_runner (Drift)
        if: steps.detect.outputs.has_flutter == 'true'
        run: |
          if grep -q "drift_dev" pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          else
            echo "Không dùng Drift, bỏ qua build_runner"
          fi

      - name: flutter analyze
        if: steps.detect.outputs.has_flutter == 'true'
        run: flutter analyze

      - name: flutter test
        if: steps.detect.outputs.has_flutter == 'true'
        run: flutter test --reporter expanded

      - name: Detect Android project
        id: android
        if: steps.detect.outputs.has_flutter == 'true'
        run: |
          if [ -d android ]; then
            echo "has_android=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_android=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Chưa có thư mục android/ (Phase 1b). Bỏ qua build APK."
          fi

      - name: Build APK release (split-per-abi)
        if: steps.android.outputs.has_android == 'true'
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        if: steps.android.outputs.has_android == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ttx-taximeter-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
